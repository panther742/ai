name: Build Panther APK

on:
  push:
    branches: [arena/01a081bf-ai]
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}  # manual trigger

permissions:
  contents: write
  issues: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Panther debug APK
        id: build
        working-directory: Panther-Android
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -n 5 build.log
          exit 0

      - name: Report build log to issue (on failure)
        if: steps.build.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: Panther-Android
        run: |
          python3 - <<'PYEOF'
          import json, os, re
          log = open('build.log', encoding='utf-8', errors='replace').read()
          lines = log.splitlines()
          # Pull the actual compiler error lines (Kotlin "e: ...", unresolved refs, task failures)
          err = []
          for ln in lines:
              if re.search(r'(^|\s)e:\s|error:|unresolved reference|Unresolved reference|Execution failed for task|FAILURE:|What went wrong|Caused by:|KotlinCompile.*FAILED', ln, re.IGNORECASE):
                  err.append(ln)
          err_block = "\n".join(err[-120:])
          head = "\n".join(lines[:250])
          tail = "\n".join(lines[-120:])
          body = (
              f"Panther build failed in run {os.environ['GITHUB_RUN_ID']} "
              f"(commit {os.environ['GITHUB_SHA'][:8]})\n\n"
              f"### ERROR LINES\n```\n{err_block[:20000]}\n```\n\n"
              f"### HEAD\n```\n{head[:12000]}\n```\n\n"
              f"### TAIL\n```\n{tail[:12000]}\n```"
          )
          payload = json.dumps({"title": f"Panther APK build failed — run {os.environ['GITHUB_RUN_ID']}", "body": body[:64000]})
          open('/tmp/issue.json', 'w').write(payload)
          PYEOF
          gh api -X POST "repos/${{ github.repository }}/issues" --input /tmp/issue.json > /tmp/issue_resp.json
          cat /tmp/issue_resp.json | python3 -c "import json,sys; print('issue #', json.load(sys.stdin)['number'])"

      - name: Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: panther-apk
          path: Panther-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panther-build-log
          path: Panther-Android/build.log
          if-no-files-found: ignore

      - name: Publish GitHub Release with APK
        if: steps.build.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: Panther-Android
        run: |
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Panther-v1.0.apk
          if gh release view v1.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0 /tmp/Panther-v1.0.apk --repo "${{ github.repository }}" --clobber
          else
            gh release create v1.0 /tmp/Panther-v1.0.apk --repo "${{ github.repository }}" --title "Panther v1.0" --notes "Panther v1.0 debug APK - JARVIS-style Hinglish AI voice assistant for Android (sideload ready). Setup guide in Panther-Android/README.md."
          fi
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/v1.0"

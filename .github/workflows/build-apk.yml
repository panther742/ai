name: Build Panther APK

on:
  push:
    branches: [arena/01a081bf-ai]
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Panther debug APK
        working-directory: Panther-Android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: panther-apk
          path: Panther-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
